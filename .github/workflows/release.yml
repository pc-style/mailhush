name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name (e.g. v1.1.1). If empty, uses the current tag or version from package.json"
                required: false
                default: ""
                type: string

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Build Extension
              run: |
                  bun run build && bun run package
                  bun run build:firefox && bun run package:firefox

            - name: Determine Tag Name
              id: tag
              shell: bash
              run: |
                  if [ -n "${{ github.event.inputs.tag_name }}" ]; then
                    echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  else
                    VERSION=$(bun -e "console.log(require('./package.json').version)")
                    echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  files: |
                      build/chrome-mv3-prod.zip
                      build/firefox-mv2-prod.zip
                  generate_release_notes: true

            - name: Check publish prerequisites
              id: publish_check
              env:
                  SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
              shell: bash
              run: |
                  if [ -z "$SUBMIT_KEYS" ]; then
                    echo "::warning title=Store publish skipped::SUBMIT_KEYS secret is empty — skipping store uploads. Add the SUBMIT_KEYS repo secret to enable auto-publishing."
                  elif ! jq -e . >/dev/null 2>&1 <<<"$SUBMIT_KEYS"; then
                    echo "::warning title=Store publish skipped::SUBMIT_KEYS is set but is not valid JSON — skipping store uploads."
                  else
                    for store in chrome firefox; do
                      if jq -e ".$store" >/dev/null <<<"$SUBMIT_KEYS"; then
                        echo "$store=true" >> "$GITHUB_OUTPUT"
                      else
                        echo "::warning title=Store publish skipped::SUBMIT_KEYS has no $store keys — skipping the $store upload."
                      fi
                    done
                  fi

            # bpp v3 only speaks the Chrome Web Store V1 API, which Google retired on
            # 2026-10-15, so Chrome is published here through the V2 API instead.
            - name: Publish to Chrome Web Store
              if: ${{ steps.publish_check.outputs.chrome == 'true' }}
              env:
                  SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
                  PUBLISHER_ID: d893d10e-a937-478e-bb8d-e017cefbc86e
              shell: bash
              run: |
                  set -euo pipefail
                  key() { jq -r ".chrome.$1" <<<"$SUBMIT_KEYS"; }
                  ITEM="publishers/$PUBLISHER_ID/items/$(key extId)"
                  TOKEN=$(curl -sSf https://oauth2.googleapis.com/token \
                    -d client_id="$(key clientId)" -d client_secret="$(key clientSecret)" \
                    -d refresh_token="$(key refreshToken)" -d grant_type=refresh_token | jq -r .access_token)
                  echo "::add-mask::$TOKEN"
                  api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$@"; }

                  STATE=$(api -X POST -T build/chrome-mv3-prod.zip \
                    "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload" | jq -r .uploadState)
                  for _ in $(seq 30); do
                    [ "$STATE" = IN_PROGRESS ] || break
                    sleep 10
                    STATE=$(api "https://chromewebstore.googleapis.com/v2/$ITEM:fetchStatus" | jq -r .lastAsyncUploadState)
                  done
                  if [ "$STATE" != SUCCEEDED ]; then
                    echo "::error title=Chrome publish::Upload ended in state $STATE."
                    exit 1
                  fi

                  api -X POST "https://chromewebstore.googleapis.com/v2/$ITEM:publish" | jq -c '{state, itemId}'
                  echo "::notice title=Chrome publish::Uploaded chrome-mv3-prod.zip and submitted it for review. It publishes automatically once approved."

            - name: Publish to Firefox Add-ons
              if: ${{ steps.publish_check.outputs.firefox == 'true' }}
              uses: PlasmoHQ/bpp@v3
              with:
                  keys: ${{ secrets.SUBMIT_KEYS }}
                  firefox-file: build/firefox-mv2-prod.zip

            - name: Confirm Firefox publish
              if: ${{ steps.publish_check.outputs.firefox == 'true' }}
              shell: bash
              run: echo "::notice title=Firefox publish::Submitted firefox-mv2-prod.zip to Firefox Add-ons. Check the AMO developer dashboard for review status."
