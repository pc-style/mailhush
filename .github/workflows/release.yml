name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name (e.g. v1.1.1). If empty, uses the current tag or version from package.json"
                required: false
                default: ""
                type: string

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Build Extension
              run: |
                  bun run build && bun run package
                  bun run build:firefox && bun run package:firefox

            - name: Determine Tag Name
              id: tag
              shell: bash
              run: |
                  if [ -n "${{ github.event.inputs.tag_name }}" ]; then
                    echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  else
                    VERSION=$(bun -e "console.log(require('./package.json').version)")
                    echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  files: |
                      build/chrome-mv3-prod.zip
                      build/firefox-mv2-prod.zip
                  generate_release_notes: true

            - name: Check publish prerequisites
              id: publish_check
              env:
                  SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
              shell: bash
              run: |
                  if [ -n "$SUBMIT_KEYS" ]; then
                    if node -e "JSON.parse(process.env.SUBMIT_KEYS)" >/dev/null 2>&1; then
                      echo "::notice title=Store publish::SUBMIT_KEYS is set and valid JSON — uploading to the Chrome Web Store and Firefox Add-ons."
                      echo "will_publish=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "::warning title=Store publish skipped::SUBMIT_KEYS is set but is not valid JSON — skipping store uploads."
                      echo "will_publish=false" >> "$GITHUB_OUTPUT"
                    fi
                  else
                    echo "::warning title=Store publish skipped::SUBMIT_KEYS secret is empty — skipping store uploads. Add the SUBMIT_KEYS repo secret to enable auto-publishing."
                    echo "will_publish=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish to Chrome Web Store and Firefox Add-ons
              if: ${{ steps.publish_check.outputs.will_publish == 'true' }}
              uses: PlasmoHQ/bpp@v3
              with:
                  keys: ${{ secrets.SUBMIT_KEYS }}
                  chrome-file: build/chrome-mv3-prod.zip
                  firefox-file: build/firefox-mv2-prod.zip

            - name: Confirm store publish
              if: ${{ steps.publish_check.outputs.will_publish == 'true' }}
              shell: bash
              run: echo "::notice title=Store publish::Submitted to the Chrome Web Store and Firefox Add-ons. Check both developer dashboards for review status."
