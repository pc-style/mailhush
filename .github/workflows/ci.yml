name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    extension:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.2.9
            - run: bun install --frozen-lockfile
            - run: bun run test
            - run: bun run typecheck
            - run: bun run build
            - run: bun run build:firefox
            - run: bun run package:source

    website:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: website/why/package-lock.json
            - run: npm ci
              working-directory: website/why
            - run: npm run build
              working-directory: website/why
